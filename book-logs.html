<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manuscript & Book Logs | Thrika Publications</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --emerald-deep: #062c22;
            --emerald-main: #0b3c2f;
            --emerald-mid: #145343;
            --emerald-soft: #f1f8f5;
            --emerald-tint: #e3efe9;
            --gold-accent: #d4af37;
            --text-dark: #0a221b;
            --text-muted: #526f65;
            --border-light: #d0e1d9;
            --shadow-soft: 0 10px 30px rgba(6, 44, 34, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--emerald-soft); color: var(--text-dark); padding: 10px; }

        .card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-soft);
            padding: 24px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 14px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .card-header h2 {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--emerald-deep);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .table-controls {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .search-box { position: relative; flex: 1; min-width: 240px; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-box input {
            width: 100%; padding: 11px 14px 11px 38px; border: 1px solid var(--border-light);
            border-radius: 10px; font-size: 0.9rem; outline: none;
        }

        select, input[type="text"], input[type="email"], input[type="tel"], input[type="date"], textarea {
            width: 100%; padding: 11px 14px; border: 1px solid var(--border-light);
            border-radius: 10px; font-size: 0.9rem; outline: none; background: #ffffff; color: var(--text-dark);
        }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.86rem; }

        th {
            background: var(--emerald-soft); color: var(--emerald-deep); padding: 12px 14px;
            font-weight: 700; border-bottom: 2px solid var(--border-light); white-space: nowrap;
        }

        td { padding: 12px 14px; border-bottom: 1px solid var(--border-light); color: var(--text-dark); white-space: nowrap; }
        tr:hover { background-color: rgba(241, 248, 245, 0.6); }

        .status-badge {
            padding: 6px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 700;
            display: inline-block; background: var(--emerald-tint); color: var(--emerald-deep); border: 1px solid var(--border-light);
        }

        .btn-submit {
            background: var(--emerald-main); color: #ffffff; border: none; padding: 10px 20px;
            border-radius: 10px; font-weight: 700; font-size: 0.88rem; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--emerald-deep); }

        .btn-action-icon {
            padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; border: none; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 600;
        }

        .btn-wa { background: #25D366; color: #ffffff; }
        .btn-wa:hover { background: #1da851; }
        .btn-mail { background: var(--emerald-main); color: #ffffff; }
        .btn-mail:hover { background: var(--emerald-deep); }
        .btn-edit { background: var(--gold-accent); color: var(--emerald-deep); }
        .btn-edit:hover { background: #c29f2e; }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 2.5rem; color: var(--border-light); margin-bottom: 10px; display: block; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(6, 44, 34, 0.7); backdrop-filter: blur(4px); z-index: 99999;
            display: none; align-items: center; justify-content: center;
        }

        .modal-box {
            background: #ffffff; border-radius: 18px; width: 90%; max-width: 440px;
            padding: 28px 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.25); border: 2px solid var(--gold-accent);
            text-align: center; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-icon {
            width: 54px; height: 54px; border-radius: 50%; background: var(--emerald-soft);
            color: var(--emerald-main); display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; margin: 0 auto 14px auto;
        }

        .modal-title { font-size: 1.2rem; font-weight: 800; color: var(--emerald-deep); margin-bottom: 6px; }
        .modal-message { font-size: 0.88rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; text-align: left; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full-width { grid-column: 1 / -1; }
        label { font-size: 0.82rem; font-weight: 700; color: var(--emerald-main); }

        .status-history-box {
            background: var(--emerald-soft); padding: 12px; border-radius: 10px;
            border: 1px solid var(--border-light); font-size: 0.78rem; color: var(--emerald-deep); margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Notification Popup Overlay -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-icon" class="modal-icon"><i class="fa-solid fa-circle-check"></i></div>
            <h3 id="modal-title" class="modal-title">Notice</h3>
            <p id="modal-message" class="modal-message">Updated successfully.</p>
            <button onclick="closeModalBox()" class="btn-submit">OK</button>
        </div>
    </div>

    <!-- Edit Book Record Popup Modal -->
    <div id="edit-overlay" class="modal-overlay">
        <div class="modal-box" style="max-width: 680px; text-align: left;">
            <div class="card-header" style="margin-bottom: 14px; padding-bottom: 10px;">
                <h2 style="font-size: 1.05rem;"><i class="fa-solid fa-pen-to-square"></i> Edit Manuscript & Status Details</h2>
            </div>
            <form id="edit-book-form" onsubmit="saveBookEdits(event)">
                <input type="hidden" id="edit-row-index">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Book Title *</label>
                        <input type="text" id="edit-book-title" required>
                    </div>
                    <div class="form-group">
                        <label>Author Name *</label>
                        <input type="text" id="edit-author-name" required>
                    </div>
                    <div class="form-group">
                        <label>Author Email *</label>
                        <input type="email" id="edit-author-email" required>
                    </div>
                    <div class="form-group">
                        <label>Author Mobile *</label>
                        <input type="tel" id="edit-author-mobile" required>
                    </div>
                    <div class="form-group">
                        <label>Category *</label>
                        <select id="edit-category" required>
                            <option value="SHORT STORY">SHORT STORY</option>
                            <option value="NOVEL">NOVEL</option>
                            <option value="FICTION">FICTION</option>
                            <option value="NON-FICTION">NON-FICTION</option>
                            <option value="POETRY">POETRY</option>
                            <option value="ACADEMIC">ACADEMIC</option>
                            <option value="BIOGRAPHY">BIOGRAPHY</option>
                            <option value="OTHER">OTHER</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Current Status *</label>
                        <select id="edit-status" onchange="toggleDynamicStatusDateField()" required>
                            <option value="Script Received">Script Received</option>
                            <option value="Accepted">Accepted</option>
                            <option value="Design">Design</option>
                            <option value="Coverpage Release">Coverpage Release</option>
                            <option value="Layout Design">Layout Design</option>
                            <option value="Printing">Printing</option>
                            <option value="Published">Published</option>
                        </select>
                    </div>

                    <!-- Dynamic Selected Status Date Input -->
                    <div class="form-group" id="dynamic-date-container">
                        <label id="dynamic-date-label">Selected Status Date *</label>
                        <input type="date" id="edit-status-date">
                    </div>

                    <div class="form-group">
                        <label>Assigned Editor</label>
                        <input type="text" id="edit-editor">
                    </div>

                    <!-- Read-only Summary of Previously Saved Status Dates -->
                    <div class="form-group full-width">
                        <div class="status-history-box">
                            <strong>Saved Milestone Dates:</strong>
                            <div id="saved-milestones-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px; margin-top: 6px;"></div>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label>Editorial Notes / Remarks</label>
                        <textarea id="edit-remarks" rows="2"></textarea>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px;">
                    <button type="button" onclick="closeEditModal()" class="btn-submit" style="background:#6b7280;">Cancel</button>
                    <button type="submit" class="btn-submit"><i class="fa-solid fa-floppy-disk"></i> Save & Update Sheet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Main Container Card -->
    <div class="card">
        <div class="card-header">
            <h2><i class="fa-solid fa-list-check"></i> Manuscript & Book Receipt Logs</h2>
            <button onclick="loadBookReceiptsFromSheet()" class="btn-submit" style="padding:6px 12px; font-size:0.8rem;">
                <i class="fa-solid fa-rotate-right"></i> Refresh
            </button>
        </div>

        <div class="table-controls">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" onkeyup="filterTable()" placeholder="Search title, author, mobile, email...">
            </div>
            <div style="width: 220px;">
                <select id="filter-status" onchange="filterTable()">
                    <option value="">All Statuses</option>
                    <option value="Script Received">Script Received</option>
                    <option value="Accepted">Accepted</option>
                    <option value="Design">Design</option>
                    <option value="Coverpage Release">Coverpage Release</option>
                    <option value="Layout Design">Layout Design</option>
                    <option value="Printing">Printing</option>
                    <option value="Published">Published</option>
                </select>
            </div>
        </div>

        <div class="table-responsive">
            <table id="manuscripts-table">
                <thead>
                    <tr>
                        <th>Rec. Date</th>
                        <th>Book Title</th>
                        <th>Author</th>
                        <th>Email & Mobile</th>
                        <th>Category</th>
                        <th>Current Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr>
                        <td colspan="7" class="empty-state">
                            <i class="fa-solid fa-spinner fa-spin"></i>
                            Loading manuscript logs from Google Sheet...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzswEvEe8UQRRTIXKmAukCrOLINLtPaMnTHv8tcaHOnYNs8RCaL3yGajFMY_00164Tm/exec";
        let localBooksData = [];

        window.addEventListener('DOMContentLoaded', loadBookReceiptsFromSheet);

        function formatCleanDate(dateInput) {
            if (!dateInput || dateInput === '--' || dateInput === '') return '--';
            const d = new Date(dateInput);
            if (isNaN(d.getTime())) return String(dateInput).split('T')[0] || '--';
            const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            const day = String(d.getDate()).padStart(2, '0');
            const month = months[d.getMonth()];
            const year = d.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function showModalBox(title, message, isSuccess = true) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            document.getElementById('modal-icon').innerHTML = isSuccess ? 
                `<i class="fa-solid fa-circle-check" style="color:#10b981;"></i>` : 
                `<i class="fa-solid fa-circle-exclamation" style="color:#ef4444;"></i>`;
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModalBox() { document.getElementById('modal-overlay').style.display = 'none'; }
        function closeEditModal() { document.getElementById('edit-overlay').style.display = 'none'; }

        function loadBookReceiptsFromSheet() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = `<tr><td colspan="7" class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i> Loading manuscript logs...</td></tr>`;

            fetch(`${GOOGLE_APPS_SCRIPT_URL}?type=bookReceipts`)
            .then(res => res.json())
            .then(data => {
                localBooksData = data || [];
                renderTable();
            })
            .catch(() => {
                tbody.innerHTML = `<tr><td colspan="7" class="empty-state"><i class="fa-solid fa-triangle-exclamation" style="color:#dc2626;"></i><strong>No books available</strong></td></tr>`;
            });
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (localBooksData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="empty-state"><i class="fa-solid fa-book-open"></i><strong>No books available</strong></td></tr>`;
                return;
            }

            localBooksData.forEach((item, index) => {
                const row = document.createElement('tr');
                const cleanMobile = (item.authorMobile || '').replace(/[^0-9]/g, '');

                row.innerHTML = `
                    <td>${formatCleanDate(item.receivedDate)}</td>
                    <td><strong style="cursor:pointer; color:var(--emerald-main);" onclick="openEditModal(${index})">${item.bookTitle || 'Untitled'}</strong></td>
                    <td>${item.authorName || 'Unknown'}</td>
                    <td>${item.authorEmail || ''}<br><small style="color:var(--text-muted)">${item.authorMobile || ''}</small></td>
                    <td>${item.category || 'N/A'}</td>
                    <td><span class="status-badge">${item.status || 'Script Received'}</span></td>
                    <td>
                        <button onclick="openEditModal(${index})" class="btn-action-icon btn-edit"><i class="fa-solid fa-pen"></i> Edit</button>
                        <a href="https://wa.me/${cleanMobile}?text=${encodeURIComponent(`Dear ${item.authorName}, your manuscript "${item.bookTitle}" status is now: ${item.status}`)}" target="_blank" class="btn-action-icon btn-wa"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
                        <button onclick="resendAcceptanceMail('${item.authorName}', '${item.authorEmail}', '${item.bookTitle}', '${item.category}', '${item.publishedDate || item.scriptAcceptedDate || item.receivedDate}', '${item.authorMobile}', '${item.status}', this)" class="btn-action-icon btn-mail"><i class="fa-solid fa-envelope"></i> Email</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function toggleDynamicStatusDateField() {
            const status = document.getElementById('edit-status').value;
            const label = document.getElementById('dynamic-date-label');
            const input = document.getElementById('edit-status-date');
            const idx = document.getElementById('edit-row-index').value;
            const currentItem = localBooksData[idx] || {};

            label.textContent = `${status} Date *`;

            // Populate currently saved date for this selected status
            let existingDateInput = "";
            if (status === 'Script Received') existingDateInput = currentItem.scriptReceivedDateInput || "";
            else if (status === 'Accepted') existingDateInput = currentItem.scriptAcceptedDateInput || "";
            else if (status === 'Design') existingDateInput = currentItem.designDateInput || "";
            else if (status === 'Coverpage Release') existingDateInput = currentItem.coverpageReleaseDateInput || "";
            else if (status === 'Layout Design') existingDateInput = currentItem.layoutDateInput || "";
            else if (status === 'Printing') existingDateInput = currentItem.printingDateInput || "";
            else if (status === 'Published') existingDateInput = currentItem.publishedDateInput || "";

            if (existingDateInput) {
                input.value = existingDateInput;
            } else {
                input.valueAsDate = new Date();
            }
        }

        function openEditModal(index) {
            const item = localBooksData[index];
            document.getElementById('edit-row-index').value = index;
            document.getElementById('edit-book-title').value = item.bookTitle || '';
            document.getElementById('edit-author-name').value = item.authorName || '';
            document.getElementById('edit-author-email').value = item.authorEmail || '';
            document.getElementById('edit-author-mobile').value = item.authorMobile || '';
            document.getElementById('edit-category').value = item.category || 'SHORT STORY';
            document.getElementById('edit-status').value = item.status || 'Script Received';
            document.getElementById('edit-editor').value = item.editor || '';
            document.getElementById('edit-remarks').value = item.remarks || '';

            // Display previously saved milestone dates
            const milestonesList = document.getElementById('saved-milestones-list');
            milestonesList.innerHTML = `
                <div><span>Received:</span> <strong>${formatCleanDate(item.scriptReceivedDate || item.receivedDate)}</strong></div>
                <div><span>Accepted:</span> <strong>${formatCleanDate(item.scriptAcceptedDate)}</strong></div>
                <div><span>Design:</span> <strong>${formatCleanDate(item.designDate)}</strong></div>
                <div><span>Cover Release:</span> <strong>${formatCleanDate(item.coverpageReleaseDate)}</strong></div>
                <div><span>Layout:</span> <strong>${formatCleanDate(item.layoutDate)}</strong></div>
                <div><span>Printing:</span> <strong>${formatCleanDate(item.printingDate)}</strong></div>
                <div><span>Published:</span> <strong>${formatCleanDate(item.publishedDate)}</strong></div>
            `;

            toggleDynamicStatusDateField();
            document.getElementById('edit-overlay').style.display = 'flex';
        }

        function saveBookEdits(event) {
            event.preventDefault();
            const idx = document.getElementById('edit-row-index').value;
            const status = document.getElementById('edit-status').value;
            const rawStatusDate = document.getElementById('edit-status-date').value;
            const formattedDate = formatCleanDate(rawStatusDate);

            // Update specific milestone column date based on status selection
            if (status === 'Script Received') localBooksData[idx].scriptReceivedDate = formattedDate;
            else if (status === 'Accepted') localBooksData[idx].scriptAcceptedDate = formattedDate;
            else if (status === 'Design') localBooksData[idx].designDate = formattedDate;
            else if (status === 'Coverpage Release') localBooksData[idx].coverpageReleaseDate = formattedDate;
            else if (status === 'Layout Design') localBooksData[idx].layoutDate = formattedDate;
            else if (status === 'Printing') localBooksData[idx].printingDate = formattedDate;
            else if (status === 'Published') localBooksData[idx].publishedDate = formattedDate;

            localBooksData[idx] = {
                ...localBooksData[idx],
                bookTitle: document.getElementById('edit-book-title').value.trim(),
                authorName: document.getElementById('edit-author-name').value.trim(),
                authorEmail: document.getElementById('edit-author-email').value.trim(),
                authorMobile: document.getElementById('edit-author-mobile').value.trim(),
                category: document.getElementById('edit-category').value,
                status: status,
                editor: document.getElementById('edit-editor').value.trim(),
                remarks: document.getElementById('edit-remarks').value.trim()
            };

            closeEditModal();
            renderTable();

            // Persist changes to Google Sheet
            fetch(GOOGLE_APPS_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({
                    action: "updateBookReceiptBatch",
                    records: localBooksData
                })
            })
            .then(() => showModalBox("Status Saved", `Manuscript status updated to '${status}' (${formattedDate}) in Google Sheet!`, true))
            .catch(() => showModalBox("Notice", "Status saved locally.", true));
        }

        function resendAcceptanceMail(name, email, title, category, acceptedDate, contact, currentStatus, btnElement) {
            if (btnElement) {
                btnElement.disabled = true;
                btnElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Sending...`;
            }

            fetch(GOOGLE_APPS_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({
                    action: "sendAcceptanceMailOnly",
                    authorName: name,
                    authorEmail: email,
                    bookTitle: title,
                    category: category,
                    acceptedDate: acceptedDate || formatCleanDate(new Date()),
                    authorMobile: contact,
                    currentStatus: currentStatus
                })
            })
            .then(() => showModalBox("Email Sent", `Status email sent to ${email} (CCed to team)!`, true))
            .catch(() => showModalBox("Email Sent", `Dispatched email request to ${email}.`, true))
            .finally(() => {
                if (btnElement) {
                    btnElement.disabled = false;
                    btnElement.innerHTML = `<i class="fa-solid fa-envelope"></i> Email`;
                }
            });
        }

        function filterTable() {
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const statusVal = document.getElementById('filter-status').value;
            const rows = document.querySelectorAll('#table-body tr');

            rows.forEach(row => {
                if (row.querySelector('.empty-state')) return;
                const text = row.textContent.toLowerCase();
                const statusBadge = row.querySelector('.status-badge');
                const currentStatus = statusBadge ? statusBadge.textContent.trim() : '';
                
                const matchesSearch = text.includes(searchVal);
                const matchesStatus = !statusVal || currentStatus === statusVal;

                row.style.display = (matchesSearch && matchesStatus) ? '' : 'none';
            });
        }
    </script>
</body>
</html>

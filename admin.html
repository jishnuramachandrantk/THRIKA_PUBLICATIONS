<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Thrika Publications</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --emerald-deep: #062c22;
            --emerald-main: #0b3c2f;
            --emerald-mid: #145343;
            --emerald-soft: #f1f8f5;
            --emerald-tint: #e3efe9;
            --gold-accent: #d4af37;
            --gold-light: #fef3c7;
            --text-dark: #0a221b;
            --text-muted: #526f65;
            --border-light: #d0e1d9;
            --shadow-soft: 0 10px 30px rgba(6, 44, 34, 0.06);
            --sidebar-expanded: 260px;
            --sidebar-collapsed: 70px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--emerald-soft);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar Base Styling */
        aside.sidebar {
            width: var(--sidebar-expanded);
            background: var(--emerald-deep);
            color: #ffffff;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            border-right: 2px solid var(--gold-accent);
            z-index: 1000;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        /* Fixed Header Alignment */
        .sidebar-brand {
            height: 72px;
            padding: 0 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .brand-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            white-space: nowrap;
        }

        .brand-logo {
            font-size: 1.2rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-logo span {
            color: var(--gold-accent);
            font-family: 'Playfair Display', serif;
            font-style: italic;
        }

        .admin-badge {
            background: var(--gold-accent);
            color: var(--emerald-deep);
            font-size: 0.62rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-top: 3px;
            display: inline-block;
            width: fit-content;
        }

        .btn-toggle-sidebar {
            background: transparent;
            border: none;
            color: var(--gold-accent);
            font-size: 1.25rem;
            cursor: pointer;
            width: 38px;
            height: 38px;
            min-width: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }

        .btn-toggle-sidebar:hover {
            background: rgba(212, 175, 55, 0.15);
            color: #ffffff;
        }

        .sidebar-menu {
            list-style: none;
            padding: 16px 0;
            flex: 1;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            color: var(--emerald-tint);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border-left: 4px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
            white-space: nowrap;
            gap: 16px;
        }

        .sidebar-menu li a:hover, .sidebar-menu li.active a {
            background: rgba(212, 175, 55, 0.12);
            color: var(--gold-accent);
            border-left-color: var(--gold-accent);
        }

        .sidebar-menu li a i {
            font-size: 1.15rem;
            width: 24px;
            min-width: 24px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
        }

        .btn-store-link {
            color: var(--emerald-tint);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: color 0.2s;
        }

        .btn-store-link i {
            font-size: 1.1rem;
            width: 24px;
            min-width: 24px;
            text-align: center;
        }

        .btn-store-link:hover {
            color: var(--gold-accent);
        }

        /* Workspace */
        main.main-content {
            margin-left: var(--sidebar-expanded);
            flex: 1;
            padding: 28px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.sidebar-collapsed aside.sidebar {
            width: var(--sidebar-collapsed);
        }

        body.sidebar-collapsed main.main-content {
            margin-left: var(--sidebar-collapsed);
        }

        body.sidebar-collapsed .brand-info,
        body.sidebar-collapsed .sidebar-menu li a span,
        body.sidebar-collapsed .sidebar-footer span {
            display: none !important;
        }

        body.sidebar-collapsed .sidebar-brand {
            justify-content: center;
            padding: 0;
        }

        body.sidebar-collapsed .sidebar-menu li a {
            padding: 14px 0;
            justify-content: center;
            gap: 0;
        }

        body.sidebar-collapsed .sidebar-footer {
            padding: 16px 0;
            display: flex;
            justify-content: center;
        }

        body.sidebar-collapsed .btn-store-link {
            justify-content: center;
            gap: 0;
        }

        /* Top Header */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #ffffff;
            padding: 16px 24px;
            border-radius: 14px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-soft);
        }

        .page-title h1 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--emerald-deep);
        }

        .page-title p {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: var(--emerald-main);
            color: var(--gold-accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        /* Embedded Frame */
        #content-frame {
            width: 100%;
            flex: 1;
            min-height: 720px;
            border: none;
            border-radius: 16px;
            background: transparent;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-info">
                <a href="admin.html" class="brand-logo">
                    THRIKA <span>Publications</span>
                </a>
                <span class="admin-badge">Admin Portal</span>
            </div>
            <button class="btn-toggle-sidebar" onclick="toggleSidebar()" title="Toggle Sidebar">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <ul class="sidebar-menu">
            <li class="active" onclick="navigateTo('dashboard-overview.html', this, 'Dashboard Overview', 'Real-time sales performance and key business metrics')">
                <a title="Dashboard"><i class="fa-solid fa-chart-line"></i> <span>Dashboard</span></a>
            </li>
            <li onclick="navigateTo('add-book.html', this, 'Add New Book Title', 'Publish a new title directly to your online catalog')">
                <a title="Add New Book"><i class="fa-solid fa-plus-circle"></i> <span>Add New Book</span></a>
            </li>
            <li onclick="navigateTo('recent-orders.html', this, 'Customer Order Management', 'Track sales, order status, and customer shipping info')">
                <a title="Recent Orders"><i class="fa-solid fa-receipt"></i> <span>Recent Orders</span></a>
            </li>
            <li onclick="navigateTo('inventory-catalog.html', this, 'Inventory & Catalog Manager', 'View, filter, or remove books from your live inventory')">
                <a title="Managed Inventory"><i class="fa-solid fa-book-bookmark"></i> <span>Managed Inventory</span></a>
            </li>
            <!-- New Delivery Charge Option -->
            <li onclick="navigateTo('delivery_charge.html', this, 'State Delivery Charges', 'Configure shipping fees per state and regional zones')">
                <a title="Delivery Charges"><i class="fa-solid fa-truck-fast"></i> <span>Delivery Charges</span></a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <a href="index.html" class="btn-store-link" target="_blank" title="View Live Store">
                <i class="fa-solid fa-store"></i> <span>View Live Store</span>
            </a>
        </div>
    </aside>

    <!-- Main Workspace Area -->
    <main class="main-content">
        <div class="top-header">
            <div class="page-title">
                <h1 id="header-title">Dashboard Overview</h1>
                <p id="header-subtitle">Real-time sales performance and key business metrics</p>
            </div>
            <div class="user-profile">
                <div class="avatar">TP</div>
                <div>
                    <h5 style="font-size: 0.88rem; font-weight: 700; color: var(--emerald-deep);">Administrator</h5>
                    <p style="font-size: 0.75rem; color: var(--text-muted);">Thrika Publications</p>
                </div>
            </div>
        </div>

        <!-- Embedded Frame for Sub-Pages -->
        <iframe id="content-frame" src="dashboard-overview.html"></iframe>
    </main>

    <script>
        function toggleSidebar() {
            document.body.classList.toggle('sidebar-collapsed');
        }

        function navigateTo(pageUrl, element, title, subtitle) {
            document.querySelectorAll('.sidebar-menu li').forEach(li => li.classList.remove('active'));
            if (element) element.classList.add('active');

            document.getElementById('header-title').textContent = title;
            document.getElementById('header-subtitle').textContent = subtitle;

            document.getElementById('content-frame').src = pageUrl;
        }

        const frame = document.getElementById('content-frame');
        frame.addEventListener('load', () => {
            try {
                const innerDoc = frame.contentDocument || frame.contentWindow.document;
                if (innerDoc && innerDoc.body) {
                    frame.style.height = (innerDoc.body.scrollHeight + 30) + 'px';
                }
            } catch (e) {
                console.log("Frame height adjusted.");
            }
        });
    </script>
</body>
</html>

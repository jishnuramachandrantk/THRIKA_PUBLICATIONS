<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Thrika Publications</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --emerald-deep: #062c22;
            --emerald-main: #0b3c2f;
            --emerald-mid: #145343;
            --emerald-soft: #f1f8f5;
            --gold-accent: #d4af37;
            --gold-light: #fef3c7;
            --border-light: #d0e1d9;
            --text-dark: #0a221b;
            --text-muted: #526f65;
            --shadow-card: 0 20px 50px rgba(6, 44, 34, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--emerald-deep) 0%, var(--emerald-main) 60%, #0d4a3b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Background Orbs */
        body::before {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(20, 83, 67, 0.3) 0%, transparent 70%);
            bottom: -120px;
            right: -120px;
            pointer-events: none;
        }

        /* Login Card */
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(212, 175, 55, 0.3);
            position: relative;
            z-index: 10;
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--emerald-main);
            text-decoration: none;
            letter-spacing: -0.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .brand-logo span {
            color: var(--gold-accent);
            font-family: 'Playfair Display', serif;
            font-style: italic;
        }

        .portal-badge {
            display: inline-block;
            background: var(--emerald-soft);
            color: var(--emerald-main);
            border: 1px solid var(--border-light);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }

        .form-group label {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--emerald-deep);
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap i.input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .input-wrap input {
            width: 100%;
            padding: 12px 42px 12px 40px;
            border-radius: 10px;
            border: 1px solid var(--border-light);
            outline: none;
            font-size: 0.9rem;
            background: #ffffff;
            color: var(--text-dark);
            transition: all 0.2s ease;
        }

        .input-wrap input:focus {
            border-color: var(--emerald-mid);
            box-shadow: 0 0 0 3px rgba(20, 83, 67, 0.12);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
        }

        .toggle-password:hover {
            color: var(--emerald-main);
        }

        /* Error Notification */
        .error-alert {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 18px;
            align-items: center;
            gap: 8px;
        }

        .error-alert.active {
            display: flex;
        }

        /* Submit Button */
        .btn-login {
            width: 100%;
            background: var(--gold-accent);
            color: var(--emerald-deep);
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #e6bf3c;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .btn-login:disabled {
            background: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Footer Link */
        .login-footer {
            margin-top: 24px;
            text-align: center;
            border-top: 1px solid var(--border-light);
            padding-top: 16px;
        }

        .login-footer a {
            color: var(--emerald-mid);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .login-footer a:hover {
            color: var(--gold-accent);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <span class="portal-badge"><i class="fa-solid fa-shield-halved"></i> Management Console</span>
            <div>
                <a href="index.html" class="brand-logo">
                    THRIKA <span>Publications</span>
                </a>
            </div>
            <p>Please enter your administrator credentials</p>
        </div>

        <!-- Error Message Alert Box -->
        <div class="error-alert" id="error-box">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="error-message">Invalid username or password.</span>
        </div>

        <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
            <!-- Username Input -->
            <div class="form-group">
                <label for="username">Username / Admin ID</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="username" placeholder="Enter username" autocomplete="username" required autofocus>
                </div>
            </div>

            <!-- Password Input -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Show/Hide Password">
                        <i class="fa-solid fa-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btn-submit">
                <span>Sign In to Portal</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="login-footer">
            <a href="index.html"><i class="fa-solid fa-store"></i> Return to Public Storefront</a>
        </div>
    </div>

    <script>
        // Set Administrator Credentials
        const ADMIN_CREDENTIALS = {
            username: "admin",
            password: "thrika@2026"
        };

        // Redirect directly if already authenticated in this session
        if (sessionStorage.getItem('thrika_admin_auth') === 'true') {
            window.location.href = "admin.html";
        }

        // Toggle password show/hide
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');

            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = "password";
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Login Handler
        function handleAdminLogin(event) {
            event.preventDefault();

            const userVal = document.getElementById('username').value.trim();
            const passVal = document.getElementById('password').value;
            const errorBox = document.getElementById('error-box');
            const errorMsg = document.getElementById('error-message');
            const submitBtn = document.getElementById('btn-submit');

            // Hide previous error
            errorBox.classList.remove('active');

            if (userVal === ADMIN_CREDENTIALS.username && passVal === ADMIN_CREDENTIALS.password) {
                // Set session flag and redirect
                submitBtn.disabled = true;
                submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...`;

                sessionStorage.setItem('thrika_admin_auth', 'true');
                sessionStorage.setItem('thrika_admin_user', userVal);

                setTimeout(() => {
                    window.location.href = "admin.html";
                }, 600);
            } else {
                errorMsg.textContent = "Invalid username or password. Please try again.";
                errorBox.classList.add('active');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Thrika Publications</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --emerald-deep: #062c22;
            --emerald-main: #0b3c2f;
            --emerald-mid: #145343;
            --emerald-soft: #f1f8f5;
            --gold-accent: #d4af37;
            --gold-light: #fef3c7;
            --border-light: #d0e1d9;
            --text-dark: #0a221b;
            --text-muted: #526f65;
            --shadow-card: 0 20px 50px rgba(6, 44, 34, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--emerald-deep) 0%, var(--emerald-main) 60%, #0d4a3b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(212, 175, 55, 0.3);
            position: relative;
            z-index: 10;
        }

        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--emerald-main);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .brand-logo span {
            color: var(--gold-accent);
            font-family: 'Playfair Display', serif;
            font-style: italic;
        }

        .portal-badge {
            display: inline-block;
            background: var(--emerald-soft);
            color: var(--emerald-main);
            border: 1px solid var(--border-light);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }

        .form-group label {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--emerald-deep);
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap i.input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .input-wrap input {
            width: 100%;
            padding: 12px 42px 12px 40px;
            border-radius: 10px;
            border: 1px solid var(--border-light);
            outline: none;
            font-size: 0.9rem;
            background: #ffffff;
            color: var(--text-dark);
            transition: all 0.2s ease;
        }

        .input-wrap input:focus {
            border-color: var(--emerald-mid);
            box-shadow: 0 0 0 3px rgba(20, 83, 67, 0.12);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
        }

        .error-alert {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 18px;
            align-items: center;
            gap: 8px;
        }

        .btn-login {
            width: 100%;
            background: var(--gold-accent);
            color: var(--emerald-deep);
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #e6bf3c;
            transform: translateY(-2px);
        }

        .btn-login:disabled {
            background: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            border-top: 1px solid var(--border-light);
            padding-top: 16px;
        }

        .login-footer a {
            color: var(--emerald-mid);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <span class="portal-badge"><i class="fa-solid fa-shield-halved"></i> Management Console</span>
            <div>
                <a href="Catalog.html" class="brand-logo">
                    THRIKA <span>Publications</span>
                </a>
            </div>
            <p>Credentials are verified live against your Google Sheet</p>
        </div>

        <div class="error-alert" id="error-box">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="error-message">Invalid username or password.</span>
        </div>

        <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label for="username">Username / Admin ID</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="username" placeholder="Enter username" autocomplete="username" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                        <i class="fa-solid fa-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btn-submit">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="login-footer">
            <a href="Catalog.html"><i class="fa-solid fa-store"></i> Return to Storefront</a>
        </div>
    </div>

    <script>
        const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzswEvEe8UQRRTIXKmAukCrOLINLtPaMnTHv8tcaHOnYNs8RCaL3yGajFMY_00164Tm/exec";

        // If already authorized, redirect immediately to admin
        if (localStorage.getItem('thrika_admin_token') === 'verified') {
            window.location.href = "admin.html";
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pwdInput.type = "password";
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function handleAdminLogin(event) {
            event.preventDefault();

            const usernameVal = document.getElementById('username').value.trim();
            const passwordVal = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('error-box');
            const errorMsg = document.getElementById('error-message');
            const submitBtn = document.getElementById('btn-submit');

            errorBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Checking Google Sheet...`;

            fetch(GOOGLE_APPS_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "adminLogin",
                    username: usernameVal,
                    password: passwordVal
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data && data.authenticated) {
                    localStorage.setItem('thrika_admin_token', 'verified');
                    localStorage.setItem('thrika_admin_user', usernameVal);
                    window.location.href = "admin.html";
                } else {
                    errorMsg.textContent = "Invalid username or password. Check your AdminAuth sheet.";
                    errorBox.style.display = 'flex';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>`;
                }
            })
            .catch(() => {
                errorMsg.textContent = "Network error. Unable to connect to Google Sheets.";
                errorBox.style.display = 'flex';
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>`;
            });
        }
    </script>
</body>
</html>
